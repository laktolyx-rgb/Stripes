name: Release

# Push a tag that matches palette.json's version:
#   npm run version:set -- 0.2.0 && git commit -am "release: v0.2.0" && git tag v0.2.0 && git push --follow-tags
# Each store is published only when its secret is set, so a missing token skips that store and the rest still publish.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance

jobs:
  jetbrains:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    env:
      JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
      - name: Build plugin
        working-directory: ports/jetbrains
        run: gradle buildPlugin --no-daemon
      - name: Publish to JetBrains Marketplace
        if: env.JETBRAINS_TOKEN != ''
        working-directory: ports/jetbrains
        run: gradle publishPlugin --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: stripes-jetbrains
          path: ports/jetbrains/build/distributions/*.zip

  release:
    name: Publish & GitHub Release
    needs: jetbrains
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Tag matches palette.json version
        run: |
          V=$(node -p "require('./palette/palette.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match palette.json version $V"; exit 1
          fi

      - name: Validate, check, test
        run: npm run validate && npm run check && npm test

      - run: npm run build
      - run: npm run package:vscode

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx -y @vscode/vsce@4.1.0 publish --packagePath stripes-vscode.vsix --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx -y ovsx@1.3.0 publish stripes-vscode.vsix --pat "$OVSX_PAT"

      - name: Publish @stripes-theme/palette to npm
        if: env.NPM_TOKEN != ''
        run: npm publish -w @stripes-theme/palette --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Render wallpapers
        run: npm run assets -- wallpapers

      - name: Bundle release files
        run: |
          mkdir -p dist-release
          (cd assets && zip -qr ../dist-release/stripes-wallpapers.zip wallpapers)
          (cd ports && zip -qr ../dist-release/stripes-terminals.zip ghostty kitty alacritty windows-terminal)
          (cd ports && zip -qr ../dist-release/stripes-obsidian.zip obsidian)
          (cd ports && zip -qr ../dist-release/stripes-discord.zip discord)
          (cd ports && zip -qr ../dist-release/stripes-zed.zip zed)
          (cd ports && zip -qr ../dist-release/stripes-nvim.zip nvim)
          cp stripes-vscode.vsix "dist-release/stripes-vscode-${GITHUB_REF_NAME}.vsix"

      - uses: actions/download-artifact@v8
        with:
          name: stripes-jetbrains
          path: dist-release

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist-release/*
