# Stripes Blood. High contrast. Every token passes WCAG AAA.

[colors.primary]
background = "#000000"
foreground = "#ffffff"
dim_foreground = "#b3b3b3"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#000000"
cursor = "#ffffff"

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#ff6b6b"

[colors.selection]
text = "#ffffff"
background = "#3a0d0d"

[colors.search.matches]
foreground = "#ffffff"
background = "#4d0f0f"

[colors.search.focused_match]
foreground = "#000000"
background = "#ff6b6b"

[colors.hints.start]
foreground = "#000000"
background = "#ff6b6b"

[colors.hints.end]
foreground = "#000000"
background = "#e0e0e0"

[colors.footer_bar]
foreground = "#ffffff"
background = "#0a0a0a"

[colors.normal]
black = "#1a1a1a"
red = "#ff6b6b"
green = "#d0d0d0"
yellow = "#e8e8e8"
blue = "#b3b3b3"
magenta = "#ff9e9e"
cyan = "#c4c4c4"
white = "#ffffff"

[colors.bright]
black = "#8a8a8a"
red = "#ff8a8a"
green = "#e0e0e0"
yellow = "#f5f5f5"
blue = "#cccccc"
magenta = "#ffbdbd"
