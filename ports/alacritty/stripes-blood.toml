# Stripes Blood. High contrast on oxblood black. Every token passes WCAG AAA.

[colors.primary]
background = "#0f0405"
foreground = "#ffffff"
dim_foreground = "#b3b3b3"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#0f0405"
cursor = "#ffffff"

[colors.vi_mode_cursor]
text = "#0f0405"
cursor = "#ff6b6b"

[colors.selection]
text = "#ffffff"
background = "#401215"

[colors.search.matches]
foreground = "#ffffff"
background = "#5c1519"

[colors.search.focused_match]
foreground = "#0f0405"
background = "#ff6b6b"

[colors.hints.start]
foreground = "#0f0405"
background = "#ff6b6b"

[colors.hints.end]
foreground = "#0f0405"
background = "#e0e0e0"

[colors.footer_bar]
foreground = "#ffffff"
background = "#170708"

[colors.normal]
black = "#240c0e"
red = "#ff6b6b"
green = "#d0d0d0"
yellow = "#e8e8e8"
blue = "#b3b3b3"
magenta = "#ff9e9e"
cyan = "#c4c4c4"
white = "#ffffff"

[colors.bright]
black = "#8a8a8a"
red = "#ff8a8a"
green = "#e0e0e0"
yellow = "#f5f5f5"
blue = "#cccccc"
magenta = "#ffbdbd"
cyan = "#d9d9d9"
white = "#ffffff"
