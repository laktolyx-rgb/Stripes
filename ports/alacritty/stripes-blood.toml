# Stripes Blood. High contrast on deep oxblood. Every token passes WCAG AAA.

[colors.primary]
background = "#2a0a0d"
foreground = "#ffffff"
dim_foreground = "#b3b3b3"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#2a0a0d"
cursor = "#ffffff"

[colors.vi_mode_cursor]
text = "#2a0a0d"
cursor = "#ff8080"

[colors.selection]
text = "#ffffff"
background = "#5e1a22"

[colors.search.matches]
foreground = "#ffffff"
background = "#701d26"

[colors.search.focused_match]
foreground = "#2a0a0d"
background = "#ff8080"

[colors.hints.start]
foreground = "#2a0a0d"
background = "#ff8080"

[colors.hints.end]
foreground = "#2a0a0d"
background = "#e0e0e0"

[colors.footer_bar]
foreground = "#ffffff"
background = "#320c10"

[colors.normal]
black = "#46131a"
red = "#ff8080"
green = "#d0d0d0"
yellow = "#e8e8e8"
blue = "#b3b3b3"
magenta = "#ff9e9e"
cyan = "#c4c4c4"
white = "#ffffff"

[colors.bright]
black = "#8a8a8a"
red = "#ff9e9e"
green = "#e0e0e0"
yellow = "#f5f5f5"
blue = "#cccccc"
magenta = "#ffbdbd"
cyan = "#d9d9d9"
white = "#ffffff"
